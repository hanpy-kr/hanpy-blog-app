# 운영(또는 미리보기) 사이트 출시 점검 — 수동 실행 (세션 8)
# Actions → Release check → Run workflow. 배포가 끝난 뒤 docs/release-checklist.md 의 자동 항목을 실제 주소에 대고 확인한다
# 같은 스크립트를 CI는 빌드한 앱에 대고 돌린다(ci.yml)
name: Release check

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 점검할 주소
        default: https://hanpy-blog.com
        required: true
      expect_ga:
        description: "GA 측정 ID (예: G-ABC123). 비우면 있는지만 기록, none이면 없어야 함"
        default: ''
        required: false

permissions:
  contents: read

jobs:
  check:
    name: Release check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Check URLs (urls.before.txt 261개)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-urls.ts --base "${{ inputs.base_url }}"

      - name: Check release
        if: always()
        run: |
          GA="${{ inputs.expect_ga }}"
          status=0
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-release.ts --base "${{ inputs.base_url }}" ${GA:+--expect-ga "$GA"} --live --report release-report.md || status=$?
          cat release-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Install Playwright
        if: always()
        run: |
          npm i --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.64.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Check UI (390px · dark mode)
        if: always()
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          status=0
          node scripts/check-ui.mjs --base "${{ inputs.base_url }}" --report ui-report.md --shots shots || status=$?
          cat ui-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-check
          path: |
            release-report.md
            ui-report.md
            shots/
